<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Replacement coil">
  <defs>
    <radialGradient id="coil-bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#f4f5f7"/>
      <stop offset="100%" stop-color="#e2e4e9"/>
    </radialGradient>
    <linearGradient id="coil-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b8f96"/>
      <stop offset="20%" stop-color="#eef0f2"/>
      <stop offset="50%" stop-color="#6f7379"/>
      <stop offset="80%" stop-color="#eef0f2"/>
      <stop offset="100%" stop-color="#7c8086"/>
    </linearGradient>
    <linearGradient id="coil-wick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8ccb8"/>
      <stop offset="100%" stop-color="#b8a988"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#coil-bg)"/>
  <ellipse cx="100" cy="168" rx="30" ry="6" fill="#000" opacity="0.08"/>

  <!-- pins -->
  <rect x="92" y="18" width="6" height="18" rx="2" fill="url(#coil-metal)"/>
  <rect x="102" y="18" width="6" height="18" rx="2" fill="url(#coil-metal)"/>

  <!-- top cap -->
  <rect x="72" y="34" width="56" height="16" rx="5" fill="url(#coil-metal)"/>

  <!-- body -->
  <rect x="64" y="48" width="72" height="90" rx="12" fill="url(#coil-metal)" stroke="#5c5f64" stroke-width="1.5"/>

  <!-- airflow slots -->
  <rect x="76" y="66" width="48" height="6" rx="3" fill="#3f4246" opacity="0.5"/>
  <rect x="76" y="80" width="48" height="6" rx="3" fill="#3f4246" opacity="0.5"/>

  <!-- wick threads visible through slot -->
  <rect x="80" y="98" width="40" height="26" rx="4" fill="url(#coil-wick)"/>
  <path d="M84 100c4 4 4 8 0 12s-4 8 0 12" stroke="#8a7a5c" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M96 100c4 4 4 8 0 12s-4 8 0 12" stroke="#8a7a5c" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M108 100c4 4 4 8 0 12s-4 8 0 12" stroke="#8a7a5c" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- base -->
  <rect x="68" y="138" width="64" height="18" rx="6" fill="url(#coil-metal)"/>

  <!-- highlight -->
  <rect x="72" y="52" width="5" height="82" rx="2.5" fill="#ffffff" opacity="0.5"/>
</svg>
