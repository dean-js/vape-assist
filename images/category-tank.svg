<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sub-ohm tank">
  <defs>
    <radialGradient id="tank-bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#f4f5f7"/>
      <stop offset="100%" stop-color="#e2e4e9"/>
    </radialGradient>
    <linearGradient id="tank-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9d3da"/>
      <stop offset="18%" stop-color="#eef3f5"/>
      <stop offset="45%" stop-color="#aebac2"/>
      <stop offset="70%" stop-color="#eef3f5"/>
      <stop offset="100%" stop-color="#b7c2c9"/>
    </linearGradient>
    <linearGradient id="tank-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b8f96"/>
      <stop offset="20%" stop-color="#e7e9ec"/>
      <stop offset="50%" stop-color="#6f7379"/>
      <stop offset="80%" stop-color="#e7e9ec"/>
      <stop offset="100%" stop-color="#7c8086"/>
    </linearGradient>
    <linearGradient id="tank-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#e2a827"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#tank-bg)"/>

  <ellipse cx="100" cy="168" rx="34" ry="6" fill="#000" opacity="0.08"/>

  <!-- drip tip -->
  <rect x="86" y="24" width="28" height="14" rx="4" fill="url(#tank-metal)"/>
  <rect x="90" y="16" width="20" height="12" rx="5" fill="url(#tank-metal)"/>

  <!-- top section / airflow -->
  <rect x="70" y="38" width="60" height="20" rx="4" fill="url(#tank-metal)"/>

  <!-- glass chamber -->
  <rect x="62" y="58" width="76" height="86" rx="10" fill="url(#tank-glass)" stroke="#9aa4ac" stroke-width="1.5"/>
  <rect x="70" y="94" width="60" height="46" rx="4" fill="url(#tank-liquid)" opacity="0.85"/>

  <!-- base -->
  <rect x="66" y="144" width="68" height="22" rx="6" fill="url(#tank-metal)"/>
  <rect x="72" y="166" width="56" height="10" rx="4" fill="url(#tank-metal)" opacity="0.9"/>

  <!-- highlight streak -->
  <rect x="80" y="62" width="6" height="78" rx="3" fill="#ffffff" opacity="0.55"/>
</svg>
